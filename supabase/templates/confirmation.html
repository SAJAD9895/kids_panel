<!-- Sign-up confirmation. No child data. -->
<h2>Confirm your email</h2>
<p>Tap the button to confirm this email address for your family account:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#0f6b7a;color:#ffffff;text-decoration:none">Confirm email</a></p>
<p>Or type this code in the app: <strong style="font-size:22px;letter-spacing:4px">{{ .Token }}</strong></p>
<p>If you didn't create an account, you can ignore this email.</p>
