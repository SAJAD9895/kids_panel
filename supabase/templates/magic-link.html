<!-- Sign-in email: link AND code (the code works when the link opens on another device). No child data. -->
<h2>Sign in</h2>
<p>Tap the button on this device to sign in:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#0f6b7a;color:#ffffff;text-decoration:none">Sign in</a></p>
<p>Or type this code in the app:</p>
<p style="font-size:28px;letter-spacing:6px;font-weight:700">{{ .Token }}</p>
<p>The link and code work once and expire in 10 minutes. If you didn't ask to sign in, you can ignore this email.</p>
